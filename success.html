<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLBB - အောင်မြင်သူများ</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND GLOW ===== */
        .bg-glow {
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.06), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse, rgba(255, 70, 70, 0.04), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #99a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
            padding: 10px 0 20px;
        }

        .back-btn:hover {
            color: #ffd700;
        }

        /* ===== HEADER ===== */
        .page-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(26px, 4vw, 40px);
            font-weight: 900;
            margin-bottom: 8px;
        }

        .page-header h1 .highlight {
            color: #ffd700;
        }

        .page-header p {
            color: #99a;
            font-size: 16px;
        }

        .page-header .total-winners {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
            margin-top: 12px;
        }

        .page-header .total-winners i {
            margin-right: 8px;
        }

        /* ===== WINNER GRID ===== */
        .winner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .winner-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .winner-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.03), transparent 60%);
            opacity: 0;
            transition: 0.5s ease;
        }

        .winner-card:hover::before {
            opacity: 1;
        }

        .winner-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 215, 0, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        .winner-card .rank {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .winner-card .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
            font-weight: 700;
            color: #0b0e1a;
            font-family: 'Orbitron', sans-serif;
        }

        .winner-card .name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .winner-card .email {
            font-size: 12px;
            color: #778;
            word-break: break-all;
        }

        .winner-card .badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #51cf66;
            background: rgba(50, 255, 50, 0.08);
            padding: 2px 14px;
            border-radius: 20px;
        }

        .winner-card .badge i {
            margin-right: 4px;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            text-align: center;
            padding: 40px 0;
        }

        .loading-spinner .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 215, 0, 0.1);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-spinner p {
            color: #778;
            font-size: 14px;
        }

        /* ===== FOOTER ===== */
        .footer-note {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            color: #556;
            font-size: 12px;
        }

        .footer-note span {
            color: #ffd700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 16px 16px 40px;
            }
            .winner-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .winner-card {
                padding: 16px 12px;
            }
            .winner-card .avatar {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .winner-card .name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <!-- ===== CONTAINER ===== -->
    <div class="container">

        <!-- ===== BACK BUTTON ===== -->
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> နောက်သို့
        </a>

        <!-- ===== HEADER ===== -->
        <div class="page-header">
            <h1>
                🏆 <span class="highlight">ထိပ်တန်း အောင်မြင်သူများ</span></span>
            </h1>
            <p>
                MLBB ၁၀ နှစ်ပြည့် Giveaway မှ <strong>စိန် ၁၀,၀၀၀</strong> ရရှိသူများ
            </p>
            <div class="total-winners" id="totalWinners">
                <i class="fas fa-crown"></i> စုစုပေါင်း <span id="winnerCount">၁၅</span> ဦး
            </div>
        </div>

        <!-- ===== LOADING ===== -->
        <div id="loadingState" class="loading-spinner">
            <div class="spinner"></div>
            <p>အောင်မြင်သူများစာရင်း ယူနေသည်...</p>
        </div>

        <!-- ===== WINNER GRID ===== -->
        <div id="winnerGrid" class="winner-grid" style="display:none;">
            <!-- Winners will be rendered here -->
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer-note">
            <i class="fas fa-crown" style="color:#ffd700;"></i>
            MLBB ၁၀ နှစ်ပြည့် Giveaway &bull; <span>စိန် ၁၀,၀၀၀</span>
        </div>

    </div>

    <!-- ===== FIREBASE ===== -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        // ===== IMPORTS =====
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, query, orderByChild, equalTo, get, onValue } from "firebase/database";

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyDvJZva02_lv1ux8fo_uOqJ0mGEyD2h7eQ",
            authDomain: "mlbb-f9540.firebaseapp.com",
            projectId: "mlbb-f9540",
            storageBucket: "mlbb-f9540.firebasestorage.app",
            messagingSenderId: "935231587712",
            appId: "1:935231587712:web:6f1a9895f5289254aeed65",
            measurementId: "G-XC6G5NCQ5N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ===== DOM REFS =====
        const loadingState = document.getElementById('loadingState');
        const winnerGrid = document.getElementById('winnerGrid');
        const winnerCount = document.getElementById('winnerCount');

        // ===== SAMPLE WINNERS (နမူနာ ၁၅ ယောက်) =====
        const sampleWinners = [
            { name: '🦁 TheLionKing', email: 'lionking@mlbb.com' },
            { name: '⚡ StormBreaker', email: 'storm@mlbb.com' },
            { name: '🔥 FirePhoenix', email: 'phoenix@mlbb.com' },
            { name: '🌙 MoonlightShadow', email: 'moonlight@mlbb.com' },
            { name: '💎 DiamondHands', email: 'diamond@mlbb.com' },
            { name: '🎯 SniperPro', email: 'sniper@mlbb.com' },
            { name: '🌀 CyberNinja', email: 'cyber@mlbb.com' },
            { name: '⚔️ WarLord', email: 'warlord@mlbb.com' },
            { name: '🌟 StarGazer', email: 'stargazer@mlbb.com' },
            { name: '🏹 ArrowMaster', email: 'arrow@mlbb.com' },
            { name: '🛡️ ShieldGuardian', email: 'shield@mlbb.com' },
            { name: '🎮 GameChanger', email: 'gamechanger@mlbb.com' },
            { name: '💫 NebulaKing', email: 'nebula@mlbb.com' },
            { name: '⚡ ThunderStrike', email: 'thunder@mlbb.com' },
            { name: '👑 RoyalKing', email: 'royal@mlbb.com' }
        ];

        // ===== RENDER WINNERS =====
        function renderWinners(winners) {
            if (winners.length === 0) {
                winnerGrid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:40px 0;color:#556;">
                        <i class="fas fa-trophy" style="font-size:48px;display:block;margin-bottom:12px;color:#445;"></i>
                        အောင်မြင်သူမရှိသေးပါ
                    </div>
                `;
                winnerGrid.style.display = 'grid';
                loadingState.style.display = 'none';
                winnerCount.textContent = '၀';
                return;
            }

            let html = '';
            winners.forEach((winner, index) => {
                const initial = winner.name ? winner.name.charAt(0).toUpperCase() : 'U';
                const rank = index + 1;

                html += `
                    <div class="winner-card">
                        <div class="rank">#${rank}</div>
                        <div class="avatar">${initial}</div>
                        <div class="name">${winner.name || 'User'}</div>
                        <div class="email">${winner.email || ''}</div>
                        <div class="badge"><i class="fas fa-check-circle"></i> အတည်ပြုပြီး</div>
                    </div>
                `;
            });

            winnerGrid.innerHTML = html;
            winnerGrid.style.display = 'grid';
            loadingState.style.display = 'none';
            winnerCount.textContent = winners.length;
        }

        // ===== GET WINNERS FROM FIREBASE =====
        async function getWinnersFromFirebase() {
            try {
                const winnersRef = ref(db, 'giveaway_submissions');
                const q = query(winnersRef, orderByChild('status'), equalTo('approved'));
                const snapshot = await get(q);

                const winners = [];
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        winners.push({
                            name: data.userName || data.userEmail?.split('@')[0] || 'User',
                            email: data.userEmail || '',
                            userId: data.userId || '',
                            serverId: data.serverId || '',
                            timestamp: data.timestamp || Date.now()
                        });
                    });
                    // Sort by timestamp (newest first)
                    winners.sort((a, b) => b.timestamp - a.timestamp);
                }
                return winners;

            } catch (error) {
                console.error('Error fetching winners:', error);
                return [];
            }
        }

        // ===== LOAD WINNERS =====
        async function loadWinners() {
            try {
                // ပထမ Firebase ကနေ ယူကြည့်မယ်
                let winners = await getWinnersFromFirebase();

                // Firebase မှာ မရှိရင် နမူနာ ၁၅ ယောက်ကိုပြမယ်
                if (winners.length === 0) {
                    winners = sampleWinners.map((w, i) => ({
                        ...w,
                        timestamp: Date.now() - (i * 86400000) // ရက်အလိုက် ပြောင်းပြီး
                    }));
                }

                renderWinners(winners);

                // ===== REAL-TIME LISTEN =====
                // အောင်မြင်သူအသစ်ထပ်ရှိရင် အလိုအလျောက်ပါလာမယ်
                const winnersRef = ref(db, 'giveaway_submissions');
                const q = query(winnersRef, orderByChild('status'), equalTo('approved'));

                onValue(q, (snapshot) => {
                    const newWinners = [];
                    if (snapshot.exists()) {
                        snapshot.forEach((child) => {
                            const data = child.val();
                            newWinners.push({
                                name: data.userName || data.userEmail?.split('@')[0] || 'User',
                                email: data.userEmail || '',
                                userId: data.userId || '',
                                serverId: data.serverId || '',
                                timestamp: data.timestamp || Date.now()
                            });
                        });
                        newWinners.sort((a, b) => b.timestamp - a.timestamp);
                    }

                    // Firebase မှာ ရှိရင် နမူနာအစား အဲ့ဒါကိုပြမယ်
                    if (newWinners.length > 0) {
                        renderWinners(newWinners);
                    }
                });

            } catch (error) {
                console.error('Error loading winners:', error);
                // Error ဖြစ်ရင်လည်း နမူနာ ၁၅ ယောက်ကိုပြမယ်
                const sample = sampleWinners.map((w, i) => ({
                    ...w,
                    timestamp: Date.now() - (i * 86400000)
                }));
                renderWinners(sample);
            }
        }

        // ===== START =====
        loadWinners();

        console.log('✅ success.html loaded');
    </script>

</body>
</html>
